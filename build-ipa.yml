name: Build unsigned IPA
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 16 }
      - name: Select Xcode 13.4.1 (last Xcode that can target iOS 9)
        run: sudo xcode-select -s /Applications/Xcode_13.4.1.app
      - name: Unpack project
        run: unzip -q project.zip
      - name: Cordova project
        run: |
          npm i -g cordova@9.0.0
          cordova platform add ios@5.1.1
          cordova prepare ios
      - name: Build (unsigned)
        working-directory: platforms/ios
        run: |
          xcodebuild -project "Super Shiro Kid.xcodeproj" -scheme "Super Shiro Kid" \
            -configuration Release -sdk iphoneos -arch arm64 -arch armv7 \
            IPHONEOS_DEPLOYMENT_TARGET=9.0 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/out" build
      - name: Package IPA
        run: |
          mkdir Payload && cp -R "platforms/ios/out/Super Shiro Kid.app" Payload/
          zip -qr SuperShiroKid.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: SuperShiroKid-ipa, path: SuperShiroKid.ipa }
